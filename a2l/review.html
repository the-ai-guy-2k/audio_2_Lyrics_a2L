<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A2L human review</title>
  <style>
    html { color-scheme: light; background: #fff; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      margin: 1rem;
      background: #fff;
      color: #111;
    }
    .banner { font-family: sans-serif; background: #222; color: #fff; padding: 0.75rem; }
    .status, .legend, .inspect, .toolbar { font-family: sans-serif; }
    .toolbar { margin: 0.75rem 0; }
    button { font-size: 1rem; padding: 0.4rem 0.8rem; }
    .legend { font-size: 0.9rem; color: #333; }
    .legend .swatch { display: inline-block; padding: 0 0.25rem; }
    .legend .uncertain { background: #ffe08a; }
    .legend .corrected { box-shadow: inset 0 -2px 0 #0a6; }
    .lyrics {
      max-width: 42rem;
      font-size: 1.25rem;
      line-height: 1.75;
      white-space: normal;
      overflow-wrap: break-word;
      background: #fff;
      color: #111;
      pointer-events: none;
    }
    .lyrics .phrase {
      display: inline;
      cursor: text;
      border-radius: 0.15rem;
      color: #111;
      pointer-events: auto;
    }
    .lyrics .phrase:focus {
      outline: 2px solid #336;
      background: #eef3ff;
    }
    .lyrics .uncertain {
      background: #ffe08a;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .lyrics .corrected {
      box-shadow: inset 0 -2px 0 #0a6;
    }
    .inspect {
      margin-top: 1.25rem;
      max-width: 42rem;
      font-size: 0.9rem;
      color: #333;
      border-top: 1px solid #ccc;
      padding-top: 0.75rem;
    }
    .state {
      font-family: sans-serif;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0.75rem 0;
    }
    .state.DRAFT { color: #555; }
    .state.REVIEWED { color: #8a5a00; }
    .state.APPROVED { color: #0a6; }
    .paths { font-family: sans-serif; font-size: 0.9rem; color: #333; max-width: 42rem; }
    .lyrics.approved .phrase { cursor: default; }
  </style>
</head>
<body>
  <div class="banner">
    A2L HUMAN REVIEW — explicit APPROVED is a separate action<br>
    Engine: faster-whisper / large-v3. Save does not approve lyrics.
  </div>
  <p class="state" id="lyric-state">Loading…</p>
  <p class="status" id="status">Loading…</p>
  <p class="toolbar">
    <button id="save" type="button">Save reviewed draft</button>
    <button id="reload" type="button">Reload from disk</button>
    <button id="approve" type="button">Mark lyrics APPROVED</button>
  </p>
  <p class="paths" id="paths"></p>
  <p class="legend">
    Uncertain phrases are marked
    <span class="swatch uncertain">like this</span>.
    Human-corrected phrases are
    <span class="swatch corrected">underlined</span>.
  </p>
  <div id="lyrics" class="lyrics"></div>
  <div class="inspect" id="inspect">Click a phrase to see its original machine text and flags.</div>
  <script>
    let reviewState = null;
    let lyricState = "DRAFT";

    async function loadState() {
      const response = await fetch("/api/state");
      const payload = await response.json();
      if (!payload.ok) {
        document.getElementById("status").textContent = payload.error_code + ": " + payload.error;
        return;
      }
      render(payload);
    }

    function displayText(line) {
      return (line.human_text || "").replace(/\s+/g, " ").trim();
    }

    function saveText(line, edited) {
      const original = line.human_text || "";
      const lead = (original.match(/^\s*/) || [""])[0];
      return lead + edited.replace(/\s+/g, " ").trim();
    }

    function showState(payload) {
      const review = payload.review;
      lyricState = payload.lyric_state || "DRAFT";
      const stateEl = document.getElementById("lyric-state");
      stateEl.textContent = "LYRIC STATE: " + lyricState;
      stateEl.className = "state " + lyricState;
      const status = document.getElementById("status");
      status.textContent =
        review.authority + " / " + review.approval_status +
        " / corrected " + review.counts.human_corrected +
        " / uncertain " + review.counts.uncertain_lines;
      const paths = document.getElementById("paths");
      if (lyricState === "APPROVED") {
        paths.textContent =
          "APPROVED TXT: " + (payload.approved_txt_path || "") +
          "  |  APPROVED JSON: " + (payload.approved_json_path || "");
      } else {
        paths.textContent = "Approved lyric artifacts: NOT CREATED. Save does not approve.";
      }
      document.getElementById("save").disabled = lyricState === "APPROVED";
      document.getElementById("approve").disabled = lyricState === "APPROVED";
    }

    function render(payload) {
      const review = payload.review;
      reviewState = review;
      showState(payload);
      const root = document.getElementById("lyrics");
      root.innerHTML = "";
      root.classList.toggle("approved", lyricState === "APPROVED");
      const editable = lyricState !== "APPROVED";
      for (const line of review.lines) {
        if (line.kind === "time_gap") continue;
        const phrase = document.createElement("span");
        phrase.className = "phrase";
        if (line.uncertain) phrase.classList.add("uncertain");
        if (line.corrected) phrase.classList.add("corrected");
        phrase.dataset.index = String(line.index);
        phrase.contentEditable = editable ? "plaintext-only" : "false";
        phrase.spellcheck = false;
        phrase.setAttribute("role", "textbox");
        phrase.setAttribute("aria-label", "lyric phrase L" + line.index);
        phrase.title = (line.uncertain ? "UNCERTAIN. " : "") + (editable ? "Click to edit." : "Approved. Not editable.");
        phrase.textContent = displayText(line);
        phrase.addEventListener("focus", function () { showInspect(line, phrase); });
        phrase.addEventListener("keydown", function (event) {
          if (event.key === "Enter") event.preventDefault();
        });
        root.appendChild(phrase);
        root.appendChild(document.createTextNode(" "));
      }
      document.getElementById("inspect").textContent =
        "Click a phrase to see its original machine text and flags.";
    }

    function showInspect(line, phrase) {
      const flags = (line.flags || []).join(", ") || "none";
      const inspect = document.getElementById("inspect");
      inspect.innerHTML =
        "<strong>L" + line.index + "</strong> · " +
        (line.uncertain ? "UNCERTAIN" : "UNVERIFIED") + " · " +
        line.text_source + " · flags=" + flags +
        "<div class=\"machine\">MACHINE: </div>";
      inspect.querySelector(".machine").appendChild(
        document.createTextNode(line.machine_text || "")
      );
      inspect.appendChild(document.createTextNode(" Current display follows the editable phrase above."));
      phrase.focus();
    }

    async function save() {
      if (!reviewState) return;
      const byIndex = {};
      for (const line of reviewState.lines) byIndex[line.index] = line;
      const lines = [];
      for (const phrase of document.querySelectorAll("#lyrics .phrase")) {
        const index = Number(phrase.dataset.index);
        const line = byIndex[index];
        lines.push({
          index: index,
          human_text: saveText(line, phrase.textContent || ""),
        });
      }
      const response = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lines }),
      });
      const payload = await response.json();
      if (!payload.ok) {
        document.getElementById("status").textContent = payload.error_code + ": " + payload.error;
        return;
      }
      document.getElementById("status").textContent = "Saved (still not approved): " + payload.saved_path;
      render(payload);
    }

    async function approve() {
      if (!reviewState) return;
      const ok = window.confirm(
        "This will create AUTHORITATIVE approved lyrics.\nSave does not do this.\nContinue?"
      );
      if (!ok) return;
      const response = await fetch("/api/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ confirm: true }),
      });
      const payload = await response.json();
      if (!payload.ok) {
        document.getElementById("status").textContent = payload.error_code + ": " + payload.error;
        return;
      }
      render(payload);
    }

    document.getElementById("save").addEventListener("click", save);
    document.getElementById("reload").addEventListener("click", loadState);
    document.getElementById("approve").addEventListener("click", approve);
    loadState();
  </script>
</body>
</html>
